name: Release Multi-Platform Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Macs (M1/M2/M3)
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # Intel Macs
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # Linux - will also generate and upload latest.json
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pencyl ${{ github.ref_name }}'
          args: ${{ matrix.args }}
          releaseBody: |
            ## What's New in Pencyl ${{ github.ref_name }}

            ### Features & Improvements
            - **Fast search-bar suggestion :**  improve load speed for the searching files on the search bar
            - **Improved UI:** Removed unnecessary spaces and improve ui

            ### Bug Fixes
            - **Update function in the general setting** fix the updater function so it runs the update straight from github releases.

            ---
            *Lightweight, local-first coding built with Rust and React.*
          releaseDraft: false
          prerelease: false

      - name: Generate and Upload Update Manifest
        if: matrix.platform == 'ubuntu-22.04' && matrix.args == ''
        run: |
          # Wait for the release to be created and get its upload URL
          sleep 10
          VERSION=${{ github.ref_name }}
          
          # Get the release upload URL from the GitHub API
          UPLOAD_URL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/GreatChijioke-01/Pencyl/releases/tags/$VERSION" | \
            jq -r '.upload_url' | \
            sed 's/{?name,label}//g')
          
          echo "Release upload URL: $UPLOAD_URL"
          
          # Generate latest.json for Tauri updater
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "Pencyl $VERSION - See release notes for details",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/GreatChijioke-01/Pencyl/releases/download/$VERSION/Pencyl_${VERSION//v/}_amd64.deb"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/GreatChijioke-01/Pencyl/releases/download/$VERSION/Pencyl_${VERSION//v/}_x64-en-US.msi"
              },
              "macos-aarch64": {
                "signature": "",
                "url": "https://github.com/GreatChijioke-01/Pencyl/releases/download/$VERSION/Pencyl_${VERSION//v/}_aarch64.dmg"
              },
              "macos-x86_64": {
                "signature": "",
                "url": "https://github.com/GreatChijioke-01/Pencyl/releases/download/$VERSION/Pencyl_${VERSION//v/}_x64.dmg"
              }
            }
          }
          EOF
          
          # Upload the latest.json file
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "$UPLOAD_URL?name=latest.json"
          
          echo "Uploaded latest.json to release"