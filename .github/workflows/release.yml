name: Release Multi-Platform Build

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              `## What's New in Pencyl ${{ github.ref_name }}`,
              ``,
              `### Features & Improvements`,
              `- **Fast search-bar suggestion:** Improve load speed for searching files on the search bar`,
              `- **Improved UI:** Removed unnecessary spaces and improved UI`,
              ``,
              `### Bug Fixes`,
              `- **Update function in the general setting:** Fix the updater function so it runs the update straight from GitHub releases.`,
              ``,
              `---`,
              `*Lightweight, local-first coding built with Rust and React.*`
            ].join('\n');
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'Pencyl ${{ github.ref_name }}',
              body: body,
              draft: false,
              prerelease: false
            });
            core.setOutput('upload_url', release.upload_url);

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Macs (M1/M2/M3)
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            tauri_target: 'aarch64-apple-darwin'
          # Intel Macs
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            tauri_target: 'x86_64-apple-darwin'
          # Linux
          - platform: 'ubuntu-22.04'
            args: ''
            tauri_target: 'x86_64-unknown-linux-gnu'
          # Windows
          - platform: 'windows-latest'
            args: ''
            tauri_target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseUpload: false

      - name: Find Release Artifacts
        id: find-artifacts
        run: |
          # Find the built artifacts in the target/release/bundle directory
          if [ "$RUNNER_OS" == "Linux" ]; then
            ARTIFACT_PATH=$(find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" \) | head -1)
            ARTIFACT_NAME=$(basename "$ARTIFACT_PATH")
          elif [ "$RUNNER_OS" == "Windows" ]; then
            # On Windows, use PowerShell syntax for find
            ARTIFACT_PATH=$(find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" \) | head -1)
            ARTIFACT_NAME=$(basename "$ARTIFACT_PATH")
          elif [ "$RUNNER_OS" == "macOS" ]; then
            ARTIFACT_PATH=$(find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) | head -1)
            ARTIFACT_NAME=$(basename "$ARTIFACT_PATH")
          fi
          echo "artifact_path=$ARTIFACT_PATH" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: steps.find-artifacts.outputs.artifact_path != ''
        with:
          files: ${{ steps.find-artifacts.outputs.artifact_path }}
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.find-artifacts.outputs.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-latest-json:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate and Upload Update Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ github.ref_name }}
          
          # Generate latest.json for Tauri updater
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "Pencyl $VERSION - See release notes for details",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/Pencyl_${VERSION//v/}_amd64.deb"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/Pencyl_${VERSION//v/}_x64-en-US.msi"
              },
              "macos-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/Pencyl_${VERSION//v/}_aarch64.dmg"
              },
              "macos-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/Pencyl_${VERSION//v/}_x64.dmg"
              }
            }
          }
          EOF
          
          # Upload the latest.json file using curl
          UPLOAD_URL="${{ needs.create-release.outputs.upload_url }}"
          # Remove the {?name,label} suffix
          UPLOAD_URL=$(echo "$UPLOAD_URL" | sed 's/{?name,label}$//')
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "${UPLOAD_URL}?name=latest.json"
          
          echo "Uploaded latest.json to release"
        shell: bash