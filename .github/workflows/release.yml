name: Release Multi-Platform Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pencyl ${{ github.ref_name }}'
          releaseBody: |
            ## What's New in Pencyl ${{ github.ref_name }}

            ### Features & Improvements
            - **Seamless Auto-Updater:** Updates now check, download, and install directly inside Preferences without intrusive OS alert popups.
            - **Clean UI Feedback:** Real-time state updates during the download and restart process.

            ### Bug Fixes
            - **Ollama Integration Fix:** Resolved issues when connecting to local Ollama instances by fixing cross-origin fetching and IP resolution.

            ---
            *Lightweight, local-first coding built with Rust and React.*
          releaseDraft: false
          prerelease: false