name: Release Multi-Platform Build

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              `## What's New in Pencyl ${{ github.ref_name }}`,
              ``,
              `### Features & Improvements`,
              `**Fast search-bar suggestion:** Improve load speed for searching files on the search bar`,
              `**Improved UI:** Removed unnecessary spaces and improved UI`,
              ``,
              `### Bug Fixes`,
              `**Update function in the general setting:** Fix the updater function so it runs the update straight from GitHub releases.`,
              ``,
              `---`,
              `*Lightweight, local-first coding built with Rust and React.*`
            ].join('\n');
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'Pencyl ${{ github.ref_name }}',
              body: body,
              draft: false,
              prerelease: false
            });
            core.setOutput('upload_url', release.upload_url);

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Macs (M1/M2/M3)
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            artifact_pattern: '*.dmg'
          # Intel Macs
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            artifact_pattern: '*.dmg'
          # Linux
          - platform: 'ubuntu-22.04'
            args: ''
            artifact_pattern: '*.deb'
          # Windows
          - platform: 'windows-latest'
            args: ''
            artifact_pattern: '*.msi'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseUpload: false

      - name: Find and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle
          ARTIFACT=$(ls *${{ matrix.artifact_pattern }} 2>/dev/null | head -1)
          if [ -n "$ARTIFACT" ]; then
            echo "Found artifact: $ARTIFACT"
            UPLOAD_URL="${{ needs.create-release.outputs.upload_url }}"
            UPLOAD_URL=$(echo "$UPLOAD_URL" | sed 's/{?name,label}$//')
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$ARTIFACT" \
              "${UPLOAD_URL}?name=$(basename "$ARTIFACT")"
            echo "Uploaded $ARTIFACT"
          else
            echo "No artifact found matching ${{ matrix.artifact_pattern }}"
            ls -la
          fi
        shell: bash

  generate-latest-json:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate and Upload Update Manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ github.ref_name }}
          
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "Pencyl $VERSION - See release notes for details",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/Pencyl_${VERSION//v/}_amd64.deb"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/Pencyl_${VERSION//v/}_x64-en-US.msi"
              },
              "macos-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/Pencyl_${VERSION//v/}_aarch64.dmg"
              },
              "macos-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/Pencyl_${VERSION//v/}_x64.dmg"
              }
            }
          }
          EOF
          
          UPLOAD_URL="${{ needs.create-release.outputs.upload_url }}"
          UPLOAD_URL=$(echo "$UPLOAD_URL" | sed 's/{?name,label}$//')
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "${UPLOAD_URL}?name=latest.json"
          echo "Uploaded latest.json to release"
        shell: bash
