name: Release Multi-Platform Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Macs (M1/M2/M3)
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # Intel Macs
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # Linux
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pencyl ${{ github.ref_name }}'
          args: ${{ matrix.args }}
          releaseBody: |
            ## What's New in Pencyl ${{ github.ref_name }}

            ### Features & Improvements
            - **Fast search-bar suggestion :**  improve load speed for the searching files on the search bar
            - **Improved UI:** Removed unnecessary spaces and improve ui

            ### Bug Fixes
            - **File-explorer sidebar rendering issue:** improved the file-explorer sidebar rendering issue when rendering large projects with many directories and files.

            ---
            *Lightweight, local-first coding built with Rust and React.*
          releaseDraft: false
          prerelease: false